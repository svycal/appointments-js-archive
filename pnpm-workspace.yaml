packages:
  - site
  - site-fuma
  - packages/*
  - components/*
  - playground/assets

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true
  postman-code-generators: false

overrides:
  lodash: ^4.18.1
  lodash-es: ^4.18.1
  fast-uri: ^3.1.2
  follow-redirects: ^1.16.0
  postcss: ^8.5.14
  seroval: ^1.5.4
  '@babel/plugin-transform-modules-systemjs': ^7.29.4
  path-to-regexp@<0.2: ^0.1.13
  serialize-javascript: ^7.0.5
  node-forge: ^1.4.0
  picomatch@<3: ^2.3.2
  picomatch@>=4 <4.0.4: ^4.0.4
  yaml@>=1 <2: ^1.10.3
  flatted: ^3.4.2
  undici: ^7.24.0
  svgo: ^3.3.3
  immutable: ^5.1.5
  minimatch@<3.1.4: ^3.1.4
  minimatch@>=5 <5.1.8: ^5.1.8
  minimatch@>=9 <9.0.7: ^9.0.7
  rollup: ^4.59.0
  ajv@<6.14.0: ^6.14.0
  ajv@>=7 <8.18.0: ^8.18.0
  qs@<6.14.2: ^6.14.2
  webpack: ^5.104.1
  diff: ^8.0.3
  js-yaml@>=4 <4.1.1: ^4.1.1
  brace-expansion@<1.1.13: ^1.1.13
  brace-expansion@>=2 <2.0.3: ^2.0.3

# This is here because Docusaurus relies on hoisted dependencies
shamefullyHoist: true
